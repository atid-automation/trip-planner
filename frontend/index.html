<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Planner - v3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .toast {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .fade-in {
            animation: fadeIn 0.25s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" id="brand-link" data-testid="brand-link">
                <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <h1 class="text-xl font-bold text-slate-800">Trip Planner</h1>
                <span class="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full">v3</span>
            </div>
            <div class="flex items-center gap-3">
                <div id="user-info" class="hidden items-center gap-3">
                    <span class="text-sm text-slate-600" id="current-user-display" data-testid="current-user-display"></span>
                    <button id="btn-reset-data" class="text-sm text-slate-600 hover:text-red-600 px-3 py-1.5 rounded-md hover:bg-red-50 transition-colors" data-testid="btn-reset-data">
                        Reset Data
                    </button>
                    <button id="btn-logout" class="text-sm text-white bg-slate-700 hover:bg-slate-800 px-4 py-1.5 rounded-md transition-colors font-medium" data-testid="logout">
                        Logout
                    </button>
                </div>
                <div id="auth-links" class="hidden items-center gap-2">
                    <button id="btn-goto-login" class="text-sm text-slate-700 hover:text-indigo-600 px-3 py-1.5 rounded-md hover:bg-slate-100 transition-colors font-medium" data-testid="goto-login">
                        Login
                    </button>
                    <button id="btn-goto-register" class="text-sm text-white bg-indigo-600 hover:bg-indigo-700 px-4 py-1.5 rounded-md transition-colors font-medium" data-testid="goto-register">
                        Register
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8" id="app-main">
        <div id="view-login" class="view fade-in"></div>
        <div id="view-register" class="view hidden fade-in"></div>
        <div id="view-trips-list" class="view hidden fade-in"></div>
        <div id="view-trip-form" class="view hidden fade-in"></div>
        <div id="view-trip-details" class="view hidden fade-in"></div>
    </main>

    <div id="modal-root"></div>

    <script src="static/app.js"></script>
</body>
</html>
